version: '3.8'
services:
  app:
    build: .
    image: ${DOCKER_USERNAME}/nodeapp:${IMAGE_TAG}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: